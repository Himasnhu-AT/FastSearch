[package]
name = "web_scraper"
version = "0.1.0"
edition = "2021"
authors = ["FastSearch Contributors"]
description = "Web scraping service for FastSearch"

[dependencies]
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
scraper = "0.17"
url = "2.4"
sitemap = "0.4"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
regex = "1.9"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.29", features = ["bundled"] }
futures = "0.3"
async-trait = "0.1"
lazy_static = "1.4"
warp = "0.3"
urlencoding = "2.1"
indicatif = "0.17"

[lib]
name = "web_scraper"
path = "src/lib.rs"

[[bin]]
name = "web_scraper_cli"
path = "src/main.rs"